name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      headless:
        description: "Run in headless mode"
        required: false
        default: "true"
      environment:
        description: "Target environment"
        required: false
        default: "QA"

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'   # ✅ stable LTS version

      - name: Build & Install
        run: mvn -B install -DskipTests --no-transfer-progress

      - name: Ensure Playwright browsers are installed
        run: mvn exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Run tests (with system variables)
        run: mvn test -DsuiteXmlFile=testng.xml -Dheadless=${{ github.event.inputs.headless }} -Denvironment=${{ github.event.inputs.environment }}

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports.html
